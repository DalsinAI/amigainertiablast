<?xml version="1.0" encoding="UTF-8"?>
<!-- Inertia Blast GlowIcon art: the ship lifting the energy pod on its tractor beam.
     The AmiCradle Team's own drawing; GPL 2 or later, like the other Amiga files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.55" stop-color="#8fb4e8"/>
      <stop offset="1" stop-color="#2f5aa8"/>
    </linearGradient>
    <radialGradient id="pod" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset="0.45" stop-color="#ffb12e"/>
      <stop offset="1" stop-color="#b84a00"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3cc8e8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.5" stop-color="#ffa21c"/>
      <stop offset="1" stop-color="#d42a00"/>
    </linearGradient>
  </defs>
  <!-- tractor beam -->
  <path d="M60 56 L68 56 L80 96 L48 96 Z" fill="url(#beam)" stroke="#1d7f9a" stroke-width="2" stroke-linejoin="round"/>
  <!-- engine flames under the wings -->
  <path d="M34 53 L44 51 L37 70 Z" fill="url(#flame)" stroke="#8a2000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M94 53 L84 51 L91 70 Z" fill="url(#flame)" stroke="#8a2000" stroke-width="2" stroke-linejoin="round"/>
  <!-- ship -->
  <path d="M64 8 L98 54 L82 50 L64 60 L46 50 L30 54 Z" fill="url(#hull)" stroke="#132c63" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 20 L74 42 L64 38 L54 42 Z" fill="#dff6ff" stroke="#132c63" stroke-width="2" stroke-linejoin="round"/>
  <!-- the energy pod on its stand -->
  <circle cx="64" cy="100" r="20" fill="url(#pod)" stroke="#5a2400" stroke-width="3"/>
  <ellipse cx="57" cy="93" rx="7" ry="4.5" fill="#ffffff" fill-opacity="0.7"/>
</svg>
